<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1814" />
      <stop offset="50%" stop-color="#14100D" />
      <stop offset="100%" stop-color="#0B0806" />
    </linearGradient>

    <!-- Ember Brand Accent Gradient -->
    <linearGradient id="emberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F27042" />
      <stop offset="50%" stop-color="#D1441B" />
      <stop offset="100%" stop-color="#A82B09" />
    </linearGradient>

    <!-- Warm Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D785" />
      <stop offset="50%" stop-color="#B08432" />
      <stop offset="100%" stop-color="#845F1B" />
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#D1441B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D1441B" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Radial Glow Backdrop -->
  <circle cx="256" cy="240" r="180" fill="url(#glow)" />

  <!-- Outer Beat Rhythm Orbit Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="10 10" opacity="0.35" />

  <!-- Main Graphic Group -->
  <g filter="url(#shadow)">
    <!-- Martini Bowl Outline -->
    <path d="M 136 170 L 376 170 L 256 310 Z" fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Liquid Fill (Ember Red) -->
    <path d="M 166 205 L 346 205 L 256 300 Z" fill="url(#emberGrad)" />
    
    <!-- Glass Stem & Base -->
    <path d="M 256 310 L 256 395" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" />
    <path d="M 175 395 L 337 395" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" />

    <!-- Skewered Tapas Olive Pick -->
    <line x1="150" y1="115" x2="305" y2="245" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Spanish Olive -->
    <ellipse cx="220" cy="172" rx="26" ry="20" transform="rotate(-30 220 172)" fill="#6B7E35" stroke="#98AF47" stroke-width="4" />
    <!-- Pimento Center -->
    <circle cx="220" cy="172" r="7" fill="#D1441B" />

    <!-- Beats Sound Waves Motif (Top Right) -->
    <g transform="translate(295, 110)">
      <line x1="0" y1="40" x2="0" y2="18" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
      <line x1="18" y1="50" x2="18" y2="5" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
      <line x1="36" y1="42" x2="36" y2="22" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
      <line x1="54" y1="52" x2="54" y2="0" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
    </g>
  </g>

  <!-- Sparkle & Accent Details -->
  <path d="M 390 115 Q 390 130 405 130 Q 390 130 390 145 Q 390 130 375 130 Q 390 130 390 115 Z" fill="#FFF5DC" />
  <path d="M 125 325 Q 125 333 133 333 Q 125 333 125 341 Q 125 333 117 333 Q 125 333 125 325 Z" fill="url(#goldGrad)" />
</svg>
